name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rspec:
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.336.0
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby }}
      - run: bundle exec rspec --force-color
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ruby/setup-ruby@v1.336.0
        with:
          bundler-cache: true
          ruby-version: '3.3'
      - uses: r7kamura/rubocop-problem-matchers-action@v1.2.2
      - run: bundle exec rubocop --parallel
